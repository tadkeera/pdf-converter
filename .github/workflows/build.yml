name: Build PDF Converter (EXE + APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ------------------------------------------------------------------ Windows
  build-windows:
    name: 🪟 Windows EXE (PyInstaller)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt pyinstaller==6.9.0

      - name: Build single-file EXE
        run: pyinstaller --noconfirm --clean desktop/pdf_converter.spec

      - name: Verify EXE
        shell: pwsh
        run: |
          Get-Item desktop\dist\PDFConverter.exe | Select-Object Name, Length

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFConverter-Windows
          path: desktop/dist/PDFConverter.exe
          if-no-files-found: error

  # ----------------------------------------------------------------- Android
  build-android:
    name: 🤖 Android APK (Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Sign APK (zipalign + apksigner)
        shell: bash
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "build-tools: $BT"
          keytool -genkeypair -v -keystore pdfconverter-ci.jks -alias pdfconverter \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass pdfconverter2024 -keypass pdfconverter2024 \
            -dname "CN=PDF Converter, OU=Apps, O=tadkeera, L=Aden, C=YE" >/dev/null 2>&1
          "$BT/zipalign" -f -p 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks pdfconverter-ci.jks --ks-key-alias pdfconverter \
            --ks-pass pass:pdfconverter2024 --key-pass pass:pdfconverter2024 \
            --out PDFConverter.apk aligned.apk
          "$BT/apksigner" verify --print-certs PDFConverter.apk | head -3

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFConverter-Android
          path: PDFConverter.apk
          if-no-files-found: error
